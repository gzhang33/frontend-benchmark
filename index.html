        async function generate(paneId) {
            if (!currentPrompt) {
                alert('请先选择一个测试用例');
                return;
            }

            var select = document.getElementById('select-' + paneId);
            var modelId = select ? select.value : '';
            if (!modelId) { setStatus('请选择模型'); return; }
            var modelObj = MODELS.find(function(m) { return m.id === modelId; });
            var modelName = modelObj ? getModelDisplayName(modelObj.id, modelObj.name) : modelId;

            var loadingEl = document.getElementById('loading-' + paneId);
            var placeholder = document.getElementById('placeholder-' + paneId);
            var iframe = document.getElementById('iframe-' + paneId);
            var statsEl = document.getElementById('stats-' + paneId);

            if (!loadingEl || !placeholder || !iframe || !statsEl) return;

            loadingEl.style.display = 'flex';
            placeholder.style.display = 'none';
            iframe.style.display = 'none';
            statsEl.textContent = '';
            switchView(paneId, 'source');
            paneStatuses[paneId] = modelName + ' 生成中...';
            updateStatusBar();

            var startTime = performance.now();
            activeGenerations++;

            try {
                var systemPrompt = currentPrompt.output_type === 'html'
                    ? '你是一个前端开发专家。请根据用户的描述，生成一个完整的、可直接运行的 HTML 文件（包含所有 CSS 和 JS）。直接输出完整的 HTML 代码，不要使用任何工具或文件操作，不要输出任何解释或说明文字。'
                    : '你是一个编程专家。请根据用户的描述，生成完整的代码。直接输出代码，不要使用任何工具或文件操作，不要输出任何解释或说明文字。';

                var apiUrl = isClaudeModel(modelId) ? CLAUDE_URL : PROXY_URL;

                // Validate: custom model must have credentials, non-claude non-custom must be in .env
                if (!isClaudeModel(modelId) && !getCustomModelConfig(modelId)) {
                    var builtIn = MODELS.find(function(m) { return m.id === modelId; });
                    if (!builtIn) {
                        throw new Error('未知模型: ' + modelId + '，请在 API 配置中添加');
                    }
                }

                var requestBody = {
                    model: modelId,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: currentPrompt.prompt },
                    ],
                    max_tokens: 16384,
                    temperature: 0.7,
                    stream: true,
                };

                // Attach inline credentials for custom models
                var customConf = getCustomModelConfig(modelId);
                if (customConf) {
                    requestBody.base_url = customConf.base_url;
                    requestBody.api_key = customConf.api_key;
                }

                console.log('[generate] pane', paneId, 'model', modelId, 'fetch START', new Date().toISOString());

                var response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody),
                });

                if (!response.ok) {
                    var errBody = await response.text();
                    throw new Error('HTTP ' + response.status + ': ' + errBody.substring(0, 200));
                }

                console.log('[generate] pane', paneId, 'model', modelId, 'response OK', new Date().toISOString());

                // Read SSE stream
                var reader = response.body.getReader();
                var decoder = new TextDecoder();
                var fullContent = '';
                var buffer = '';
                var inputTokens = 0;
                var outputTokens = 0;

                var loadingText = document.getElementById('loading-text-' + paneId);

                var streamDone = false;

                while (true) {
                    var chunk = await reader.read();
                    var lines = [];
                    if (chunk.done) {
                        if (buffer.trim()) lines = buffer.split('\n');
                        buffer = '';
                        streamDone = true;
                    } else {
                        buffer += decoder.decode(chunk.value, { stream: true });
                        lines = buffer.split('\n');
                        buffer = lines.pop();
                    }

                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (!line || !line.startsWith('data: ')) continue;
                        var data = line.slice(6);
                        if (data === '[DONE]') { streamDone = true; break; }

                        try {
                            var parsed = JSON.parse(data);
                            var delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta;
                            if (delta && delta.content) {
                                fullContent += delta.content;
                                loadingText.textContent = '生成中... ' + fullContent.length + ' 字符';
                                // Stream source code view in real-time
                                var sourceCode = document.getElementById('source-code-' + paneId);
                                if (sourceCode) {
                                    sourceCode.textContent = fullContent;
                                }
                            }
                            if (parsed.usage) {
                                inputTokens = parsed.usage.prompt_tokens || 0;
                                outputTokens = parsed.usage.completion_tokens || 0;
                                console.log('[generate] pane', paneId, 'usage received:', inputTokens, '/', outputTokens);
                            }
                        } catch (e) { /* skip malformed chunks */ }
                    }

                    if (streamDone) break;
                }

                console.log('[generate] pane', paneId, 'stream DONE');
                var elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
                var totalTokens = inputTokens + outputTokens;
                var speed = elapsed > 0 ? (outputTokens / parseFloat(elapsed)).toFixed(1) : '0';
                statsEl.textContent = elapsed + 's | ' + totalTokens + ' tokens (in:' + inputTokens + ' out:' + outputTokens + ') | ' + speed + ' tok/s';
                console.log('[generate] pane', paneId, 'COMPLETE', elapsed + 's', inputTokens + '/' + outputTokens);
                paneStatuses[paneId] = modelName + ' 完成 ' + elapsed + 's';
                updateStatusBar();
                BenchmarkStore.add('generations', {
                    prompt_id: currentPrompt.id,
                    prompt_name: currentPrompt.name,
                    model_id: modelId,
                    model_name: modelName,
                    elapsed_seconds: parseFloat(elapsed),
                    input_tokens: inputTokens,
                    output_tokens: outputTokens,
                    total_tokens: totalTokens,
                    timestamp: new Date().toISOString(),
                }).catch(function() {});

                // Always populate source view
                var sourceCode = document.getElementById('source-code-' + paneId);
                sourceCode.textContent = fullContent;
                sourceCode.removeAttribute('data-highlighted');
                hljs.highlightElement(sourceCode);

                // Render based on output_type
                if (currentPrompt.output_type === 'html') {
                    var html = extractHtml(fullContent);
                    if (html) {
                        placeholder.style.display = 'none';
                        iframe.style.display = 'block';
                        iframe.srcdoc = html;
                        switchView(paneId, 'preview');
                    } else {
                        placeholder.style.display = 'none';
                        switchView(paneId, 'source');
                    }
                } else {
                    placeholder.style.display = 'none';
                    switchView(paneId, 'source');
                }
                if (blindMode && activeGenerations <= 1) showVoteFloats();
            } catch (err) {
                console.error('[generate] pane', paneId, 'error:', err.message);
                paneStatuses[paneId] = modelName + ' 失败';
                updateStatusBar();
                placeholder.style.display = 'flex';
            } finally {
                loadingEl.style.display = 'none';
                activeGenerations--;
                if (activeGenerations <= 0) {
                    activeGenerations = 0;
                }
            }
        }

        // ===== 盲评模式 =====
        let blindMode = false;
        let blindAssignments = [];

        function shuffleArray(arr) {
            var a = arr.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
            }
            return a;
        }

        function toggleBlindMode() {
            if (activeSession) return;
            blindMode = !blindMode;
            var btn = document.getElementById('blind-toggle');
            btn.textContent = '盲评模式: ' + (blindMode ? '开' : '关');

            var count = parseInt(document.getElementById('pane-count') ? document.getElementById('pane-count').value : '2');

            if (blindMode) {
                var allModels = getAllModels();
                if (allModels.length === 0) { alert('请先加载模型列表'); blindMode = false; btn.textContent = '盲评模式: 关'; return; }
                // Randomly pick models for each pane (no duplicates, from built-in + custom)
                var shuffled = shuffleArray(allModels);
                blindAssignments = [];
                for (var i = 0; i < count; i++) {
                    var nameEl = document.getElementById('model-name-' + i);
                    var selectEl = document.getElementById('select-' + i);
                    if (!nameEl || !selectEl) continue;

                    var picked = shuffled[i % shuffled.length];
                    selectEl.value = picked.id;
                    selectEl.style.display = 'none';
                    nameEl.textContent = '模型 ' + (i + 1);

                    blindAssignments.push(picked.id);
                }
                buildModelScores();
                setStatus('盲评模式已开启 - 模型已随机分配，生成后投票揭晓');
            } else {
                blindAssignments = [];
                for (var i = 0; i < count; i++) {
                    var nameEl = document.getElementById('model-name-' + i);
                    var selectEl = document.getElementById('select-' + i);
                    if (!nameEl || !selectEl) continue;

                    selectEl.style.display = '';
                    var model = MODELS.find(function(m) { return m.id === selectEl.value; });
                    var custom = getCustomModelConfig(selectEl.value);
                    nameEl.textContent = model ? getModelDisplayName(model.id, model.name) :
                        custom ? (custom.display_name || custom.id) : '-';
                }
                hideAllVoteFloats();
                buildModelScores();
                setStatus('盲评模式已关闭');
            }
        }

        function showVoteFloats() {
            var count = parseInt(document.getElementById('pane-count').value);
            for (var i = 0; i < count; i++) {
                var el = document.getElementById('vote-float-' + i);
                if (el) el.classList.add('show');
            }
        }

        function hideAllVoteFloats() {
            var floats = document.querySelectorAll('.vote-float');
            floats.forEach(function(el) { el.classList.remove('show'); });
            var btns = document.querySelectorAll('.vote-btn');
            btns.forEach(function(b) { b.classList.remove('voted-up', 'voted-down'); });
        }

        function voteForPane(paneId, direction) {
            if (!blindMode || !blindAssignments.length) return;
            var idx = parseInt(paneId);
            var modelId = blindAssignments[idx];
            var m = MODELS.find(function(m) { return m.id === modelId; });
            var label = m ? getModelDisplayName(m.id, m.name) : modelId;
            var custom = !m ? getCustomModelConfig(modelId) : null;
            if (custom) label = custom.display_name || custom.id;

            // Highlight the clicked button
            var count = parseInt(document.getElementById('pane-count').value);
            for (var i = 0; i < count; i++) {
                var upBtn = document.getElementById('vote-up-' + i);
                var downBtn = document.getElementById('vote-down-' + i);
                if (upBtn) upBtn.classList.remove('voted-up', 'voted-down');
                if (downBtn) downBtn.classList.remove('voted-up', 'voted-down');
            }
            if (direction === 'up') {
                var btn = document.getElementById('vote-up-' + paneId);
                if (btn) btn.classList.add('voted-up');
            } else {
                var btn = document.getElementById('vote-down-' + paneId);
                if (btn) btn.classList.add('voted-down');
            }

            // Build result: the up-voted model wins
            var choice = direction === 'up' ? String(idx) : findOtherPane(paneId, count);
            var labels = blindAssignments.map(function(mid) {
                var mm = MODELS.find(function(m) { return m.id === mid; });
                if (mm) return getModelDisplayName(mm.id, mm.name);
                var cc = getCustomModelConfig(mid);
                return cc ? (cc.display_name || cc.id) : mid;
            });
            var resultLabel = direction === 'up'
                ? labels[idx] + ' 胜'
                : labels[parseInt(choice)] + ' 胜';

            var result = {
                prompt_id: currentPrompt.id,
                prompt_name: currentPrompt.name,
                models: blindAssignments.slice(),
                model_names: labels.slice(),
                vote: choice,
                winner: choice === 'tie' ? 'tie' : blindAssignments[parseInt(choice)] || '',
                timestamp: new Date().toISOString(),
            };
            saveVote(result);
            setStatus('投票结果: ' + resultLabel);

            if (activeSession) {
                setTimeout(function() {
                    revealBlindIdentities();
                }, 1500);
            } else {
                setTimeout(function() {
                    toggleBlindMode();
                }, 1500);
            }
        }

        function findOtherPane(paneId, count) {
            for (var i = 0; i < count; i++) {
                if (String(i) !== paneId) return String(i);
            }
            return 'tie';
        }


        function saveVote(result) {
            BenchmarkStore.add('votes', result);
        }

        // ===== 会话管理 =====
        let activeSession = null;

        function openSessionModal() {
            if (activeSession) { alert('请先结束当前会话'); return; }
            var listEl = document.getElementById('session-model-list');
            listEl.textContent = '';
            var allModels = getAllModels();
            allModels.forEach(function(m) {
                var item = document.createElement('div');
                item.className = 'session-model-item';
                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = m.id;
                cb.dataset.displayName = m.display_name || m.name || m.id;
                cb.dataset.provider = m.provider || 'custom';
                var text = document.createElement('span');
                text.textContent = m.display_name || m.name || m.id;
                item.appendChild(cb);
                item.appendChild(text);
                listEl.appendChild(item);
            });
            document.getElementById('session-error').style.display = 'none';
            document.getElementById('session-error').className = 'session-error';
            document.getElementById('session-blind-mode').checked = false;
            document.getElementById('session-pane-count').value = '2';
            document.getElementById('session-modal').classList.add('show');
        }

        function closeSessionModal() {
            document.getElementById('session-modal').classList.remove('show');
        }

        function startSession() {
            var checkboxes = document.querySelectorAll('#session-model-list input[type="checkbox"]:checked');
            var selectedModels = [];
            checkboxes.forEach(function(cb) {
                selectedModels.push({
                    id: cb.value,
                    display_name: cb.dataset.displayName,
                    provider: cb.dataset.provider,
                });
            });

            var errorEl = document.getElementById('session-error');
            if (selectedModels.length < 2) {
                errorEl.textContent = '请至少选择 2 个模型';
                errorEl.style.display = 'block';
                return;
            }

            var paneCount = parseInt(document.getElementById('session-pane-count').value);
            if (selectedModels.length < paneCount) {
                errorEl.textContent = '选择的模型数量 (' + selectedModels.length + ') 少于分屏数量 (' + paneCount + ')';
                errorEl.style.display = 'block';
                return;
            }

            var blindEnabled = document.getElementById('session-blind-mode').checked;
            var sessionModels = blindEnabled ? shuffleArray(selectedModels) : selectedModels.slice(0, paneCount);

            activeSession = {
                id: 'session-' + Date.now(),
                models: sessionModels.slice(0, paneCount),
                blindMode: blindEnabled,
                paneCount: paneCount,
                createdAt: new Date().toISOString(),
                status: 'active',
            };

            BenchmarkStore.put('sessions', activeSession).catch(function(e) {
                console.error('Failed to persist session', e);
            });
            localStorage.setItem(ACTIVE_SESSION_KEY, activeSession.id);

            closeSessionModal();
            applySessionUI();
            setStatus('会话已开始 - ' + paneCount + ' 个模型已锁定');
        }

        function applySessionUI() {
            if (!activeSession) return;

            var paneCountEl = document.getElementById('pane-count');
            paneCountEl.value = String(activeSession.paneCount);
            paneCountEl.disabled = true;

            blindMode = activeSession.blindMode;
            blindAssignments = activeSession.models.map(function(m) { return m.id; });

            var blindBtn = document.getElementById('blind-toggle');
            blindBtn.disabled = true;
            blindBtn.textContent = activeSession.blindMode
                ? '盲评模式: 开 (会话锁定)'
                : '盲评模式: 关 (会话锁定)';

            rebuildPanes();

            if (activeSession.blindMode) {
                for (var i = 0; i < activeSession.paneCount; i++) {
                    var selectEl = document.getElementById('select-' + i);
                    var nameEl = document.getElementById('model-name-' + i);
                    if (selectEl) selectEl.style.display = 'none';
                    if (nameEl) nameEl.textContent = '模型 ' + (i + 1);
                }
            }

            document.getElementById('session-btn').style.display = 'none';
            document.getElementById('end-session-btn').style.display = '';
            document.querySelector('.header').classList.add('session-active');

            buildModelScores();
        }

        function endSession() {
            if (!activeSession) return;

            activeSession.status = 'completed';
            BenchmarkStore.put('sessions', activeSession).catch(function() {});

            activeSession = null;
            blindMode = false;
            blindAssignments = [];
            localStorage.removeItem(ACTIVE_SESSION_KEY);

            restoreFreeModeUI();
            setStatus('会话已结束');
        }

        function restoreFreeModeUI() {
            var paneCountEl = document.getElementById('pane-count');
            paneCountEl.disabled = false;

            var blindBtn = document.getElementById('blind-toggle');
            blindBtn.textContent = '盲评模式: 关';
            blindBtn.disabled = false;

            document.getElementById('session-btn').style.display = '';
            document.getElementById('end-session-btn').style.display = 'none';
            document.querySelector('.header').classList.remove('session-active');

            hideAllVoteFloats();
            rebuildPanes();
        }

        async function restoreSession() {
            var sessionId = localStorage.getItem(ACTIVE_SESSION_KEY);
            if (!sessionId) return;

            try {
                var session = await BenchmarkStore.get('sessions', sessionId);
                if (!session || session.status !== 'active') {
                    localStorage.removeItem(ACTIVE_SESSION_KEY);
                    return;
                }
                activeSession = session;
                applySessionUI();
                setStatus('已恢复会话 - ' + session.paneCount + ' 个模型已锁定');
            } catch (e) {
                console.error('Failed to restore session', e);
                localStorage.removeItem(ACTIVE_SESSION_KEY);
            }
        }

        function revealBlindIdentities() {
            for (var i = 0; i < blindAssignments.length; i++) {
                var nameEl = document.getElementById('model-name-' + i);
                var modelId = blindAssignments[i];
                var m = MODELS.find(function(m) { return m.id === modelId; });
                var custom = !m ? getCustomModelConfig(modelId) : null;
                var label = m ? getModelDisplayName(m.id, m.name) : (custom ? (custom.display_name || custom.id) : modelId);
                if (nameEl) {
                    nameEl.textContent = label;
                    nameEl.classList.add('reveal-animate');
                }
            }
            hideAllVoteFloats();
            var blindBtn = document.getElementById('blind-toggle');
            if (blindBtn) blindBtn.textContent = '盲评模式: 已揭晓';
        }

        // ===== 模型检查点评分表 =====
        function getPaneModels() {
            var count = parseInt(document.getElementById('pane-count').value);
            var models = [];
            for (var i = 0; i < count; i++) {
                var selectEl = document.getElementById('select-' + i);
                if (!selectEl) continue;
                var modelId = selectEl.value;
                var modelObj = MODELS.find(function(m) { return m.id === modelId; });
                var custom = getCustomModelConfig(modelId);
                var name, actualId;
                if (blindMode) {
                    name = '模型 ' + (i + 1);
                    actualId = modelId;
                } else if (modelObj) {
                    name = getModelDisplayName(modelObj.id, modelObj.name);
                    actualId = modelId;
                } else if (custom) {
                    name = custom.display_name || custom.id;
                    actualId = modelId;
                } else {
                    name = modelId;
                    actualId = modelId;
                }
                models.push({ paneIdx: i, modelId: actualId, displayName: name });
            }
            return models;
        }

        function buildModelScores() {
            var container = document.getElementById('model-scores-container');
            container.textContent = '';

            if (!currentPrompt) {
                container.innerHTML = '<p style="font-size:11px; color:var(--text-muted);">选择测试用例后显示评分表</p>';
                return;
            }

            var paneModels = getPaneModels();
            if (paneModels.length < 1) {
                container.innerHTML = '<p style="font-size:11px; color:var(--text-muted);">无可用模型</p>';
                return;
            }

            var checks = currentPrompt.checks;
            if (!checks || checks.length === 0) {
                container.innerHTML = '<p style="font-size:11px; color:var(--text-muted);">当前用例无检查点</p>';
                return;
            }

            // Build score table: rows = checks, columns = models
            var table = document.createElement('table');
            table.className = 'score-table';

            // Header row
            var thead = document.createElement('thead');
            var headRow = document.createElement('tr');
            var thCheck = document.createElement('th');
            thCheck.textContent = '检查点';
            thCheck.style.textAlign = 'left';
            headRow.appendChild(thCheck);

            paneModels.forEach(function(pm) {
                var th = document.createElement('th');
                th.textContent = pm.displayName;
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);

            // Body rows
            var tbody = document.createElement('tbody');
            checks.forEach(function(check, checkIdx) {
                var tr = document.createElement('tr');

                var tdLabel = document.createElement('td');
                tdLabel.className = 'check-label';
                tdLabel.textContent = check;
                tr.appendChild(tdLabel);

                paneModels.forEach(function(pm) {
                    var td = document.createElement('td');
                    var sel = document.createElement('select');
                    sel.id = 'mcheck-' + pm.paneIdx + '-' + checkIdx;
                    ['通过', '部分', '失败'].forEach(function(val, vi) {
                        var opt = document.createElement('option');
                        opt.value = val === '通过' ? 'pass' : val === '部分' ? 'partial' : 'fail';
                        opt.textContent = val;
                        sel.appendChild(opt);
                    });
                    td.appendChild(sel);
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);

            // Comment per model
            var commentDiv = document.createElement('div');
            commentDiv.className = 'mt-3';
            commentDiv.id = 'model-comments-container';
            paneModels.forEach(function(pm) {
                var row = document.createElement('div');
                row.className = 'mb-2';
                var label = document.createElement('label');
                label.style.cssText = 'font-size:11px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:4px;';
                label.textContent = pm.displayName + ' 评语';
                var textarea = document.createElement('textarea');
                textarea.style.cssText = 'width:100%; font-size:11px; border:1px solid var(--border-default); border-radius:4px; padding:6px; resize:none; background:var(--bg-base); color:var(--text-primary);';
                textarea.rows = 2;
                textarea.placeholder = '可选';
                textarea.id = 'model-comment-' + pm.paneIdx;
                row.appendChild(label);
                row.appendChild(textarea);
                commentDiv.appendChild(row);
            });
            container.appendChild(commentDiv);
        }

        // ===== 评分与导出 =====
        function saveScores() {
            if (!currentPrompt) return;

            var paneModels = getPaneModels();
            var checks = currentPrompt.checks;

            // Collect per-model per-check scores
            var modelScores = [];
            paneModels.forEach(function(pm) {
                var checkResults = [];
                checks.forEach(function(check, checkIdx) {
                    var sel = document.getElementById('mcheck-' + pm.paneIdx + '-' + checkIdx);
                    checkResults.push({
                        check: check,
                        score: sel ? sel.value : 'fail',
                    });
                });
                var passCount = checkResults.filter(function(c) { return c.score === 'pass'; }).length;
                var partialCount = checkResults.filter(function(c) { return c.score === 'partial'; }).length;
                var commentEl = document.getElementById('model-comment-' + pm.paneIdx);
                modelScores.push({
                    model_id: pm.modelId,
                    model_name: pm.displayName,
                    checks: checkResults,
                    pass_rate: checks.length > 0 ? passCount / checks.length : 0,
                    pass_count: passCount,
                    partial_count: partialCount,
                    fail_count: checks.length - passCount - partialCount,
                    comment: commentEl ? commentEl.value.trim() : '',
                });
            });

            var record = {
                prompt_id: currentPrompt.id,
                prompt_name: currentPrompt.name,
                dimension: currentPrompt.dimension,
                model_scores: modelScores,
                timestamp: new Date().toISOString(),
            };

            BenchmarkStore.add('results', record);
            setStatus('评分已保存 - ' + currentPrompt.name);
        }

        async function exportResults() {
            var results = await BenchmarkStore.getAll('results');
            var votes = await BenchmarkStore.getAll('votes');

            var exportData = {
                exported_at: new Date().toISOString(),
                results: results,
                votes: votes,
            };

            var blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'benchmark-results-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus('已导出 ' + results.length + ' 条评分结果 + ' + votes.length + ' 条投票记录');
        }

        // ===== 批量运行 =====
        let batchRunning = false;

        function toggleSelectAll(checked) {
            document.querySelectorAll('.batch-check').forEach(function(cb) {
                cb.checked = checked;
            });
        }

        function getSelectedPromptIds() {
            var ids = [];
            document.querySelectorAll('.batch-check:checked').forEach(function(cb) {
                ids.push(cb.dataset.promptId);
            });
            return ids;
        }

        async function startBatchRun() {
            if (batchRunning) return;
            var ids = getSelectedPromptIds();
            if (ids.length === 0) { alert('请先勾选要运行的测试用例'); return; }
            if (!currentPrompt && ids.length > 0) {
                var firstPrompt = promptsData.find(function(p) { return p.id === ids[0]; });
                if (firstPrompt) selectPrompt(firstPrompt, null);
            }

            batchRunning = true;
            var btn = document.getElementById('batch-run-btn');
            btn.disabled = true;
            btn.textContent = '运行中...';

            var progressEl = document.getElementById('batch-progress');
            var progressText = document.getElementById('batch-progress-text');
            var progressBar = document.getElementById('batch-progress-bar');
            progressEl.style.display = 'block';

            try {
                for (var i = 0; i < ids.length; i++) {
                    var prompt = promptsData.find(function(p) { return p.id === ids[i]; });
                    if (!prompt) continue;

                    selectPrompt(prompt, null);
                    document.querySelectorAll('.prompt-item').forEach(function(item) {
                        item.classList.toggle('active', item.dataset.promptId === ids[i]);
                    });

                    var paneCount = parseInt(document.getElementById('pane-count').value);
                    for (var p = 0; p < paneCount; p++) {
                        await generate(String(p));
                    }

                    progressText.textContent = (i + 1) + '/' + ids.length + ' (' + prompt.name + ')';
                    progressBar.style.width = ((i + 1) / ids.length * 100) + '%';
                }

                setStatus('批量运行完成: ' + ids.length + ' 个用例');
            } finally {
                batchRunning = false;
                btn.disabled = false;
                btn.textContent = '批量运行';
            }
        }

        // ===== 历史记录 =====
        async function showHistory() {
            document.getElementById('history-modal').classList.add('show');
            var content = document.getElementById('history-content');
            content.textContent = '加载中...';

            try {
                var results = await BenchmarkStore.getAll('results');
                var votes = await BenchmarkStore.getAll('votes');

                if (results.length === 0 && votes.length === 0) {
                    content.textContent = '暂无历史记录';
                    return;
                }

                var html = '';

                if (results.length > 0) {
                    html += '<h4 style="font-size:13px; font-weight:600; color:var(--text-primary); margin:0 0 8px 0;">评分记录 (' + results.length + ')</h4>';
                    results.forEach(function(r) {
                        html += '<div style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border-subtle);">';
                        html += '<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span style="font-weight:500; font-size:13px; color:var(--text-primary);">' + esc(r.prompt_name || r.prompt_id) + '</span><span style="font-size:11px; color:var(--text-muted);">' + esc((r.timestamp || '').slice(0, 16)) + '</span></div>';
                        var scores = r.model_scores || r.model_ratings || [];
                        if (scores.length > 0) {
                            html += '<table class="w-full text-xs border-collapse">';
                            // Determine if we have per-check data (new format) or just rating (old format)
                            var hasChecks = scores[0] && scores[0].checks && scores[0].checks.length > 0;
                            if (hasChecks) {
                                html += '<thead><tr style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;" style="background:var(--bg-elevated); color:var(--accent); font-size:10px;"><th class="border px-2 py-1 text-left">模型</th>';
                                var checkNames = scores[0].checks.map(function(c) { return c.check; });
                                checkNames.forEach(function(cn) {
                                    html += '<th style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;" style="font-size:10px;max-width:100px;word-wrap:break-word;">' + esc(cn) + '</th>';
                                });
                                html += '<th style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;">通过率</th></tr></thead><tbody>';
                                scores.forEach(function(ms) {
                                    html += '<tr><td class="border px-2 py-1 font-medium whitespace-nowrap">' + esc(ms.model_name) + '</td>';
                                    ms.checks.forEach(function(c) {
                                        var color = c.score === 'pass' ? '#22c55e' : c.score === 'partial' ? '#eab308' : '#ef4444';
                                        var label = c.score === 'pass' ? '通过' : c.score === 'partial' ? '部分' : '失败';
                                        html += '<td class="border px-2 py-1 text-center" style="color:' + color + '">' + label + '</td>';
                                    });
                                    var rate = (ms.pass_rate * 100).toFixed(0);
                                    html += '<td class="border px-2 py-1 text-center font-semibold">' + rate + '%</td></tr>';
                                    if (ms.comment) {
                                        html += '<tr><td style="border:1px solid var(--border-default); padding:2px 6px; color:var(--text-muted); font-size:11px;" colspan="' + (checkNames.length + 2) + '">' + esc(ms.comment) + '</td></tr>';
                                    }
                                });
                            } else {
                                html += '<thead><tr style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;" style="background:var(--bg-elevated); color:var(--accent); font-size:10px;"><th class="border px-2 py-1 text-left">模型</th><th style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;">评分</th></tr></thead><tbody>';
                                scores.forEach(function(ms) {
                                    html += '<tr><td style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;">' + esc(ms.model_name) + '</td>';
                                    if (ms.comment) html += '<td style="border:1px solid var(--border-default); padding:2px 6px; color:var(--text-secondary);">' + esc(ms.comment) + '</td>';
                                    html += '</tr>';
                                });
                            }
                            html += '</tbody></table>';
                        } else {
                            html += '<span style="color:var(--text-muted); font-size:11px;">未评分</span>';
                        }
                        html += '</div>';
                    });
                }

                if (votes.length > 0) {
                    html += '<h4 style="font-size:13px; font-weight:600; color:var(--text-primary); margin:0 0 8px 0;">投票记录 (' + votes.length + ')</h4>';
                    html += '<table class="w-full text-sm border-collapse">';
                    html += '<thead><tr style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;" style="background:var(--bg-elevated); color:var(--accent); font-size:10px;"><th class="border px-2 py-1 text-left">用例</th><th style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;">模型</th><th style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;">结果</th><th style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;">时间</th></tr></thead><tbody>';
                    votes.forEach(function(v) {
                        var modelLabels = (v.models || []).map(function(mid) {
                            var m = MODELS.find(function(m) { return m.id === mid; });
                            return esc(m ? getModelDisplayName(m.id, m.name) : mid);
                        }).join(' vs ');
                        var winnerLabel = '平局';
                        if (v.vote !== 'tie' && v.winner) {
                            var wm = MODELS.find(function(m) { return m.id === v.winner; });
                            var wCustom = !wm ? getCustomModelConfig(v.winner) : null;
                            winnerLabel = esc(wm ? getModelDisplayName(wm.id, wm.name) : (wCustom ? wCustom.display_name : v.winner)) + ' 胜';
                        }
                        html += '<tr><td style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;">' + esc(v.prompt_name || v.prompt_id) + '</td>';
                        html += '<td class="border px-2 py-1 text-center">' + (modelLabels || '-') + '</td>';
                        html += '<td class="border px-2 py-1 text-center">' + winnerLabel + '</td>';
                        html += '<td style="border:1px solid var(--border-default); padding:2px 6px; font-size:11px; color:var(--text-muted);">' + esc((v.timestamp || '').slice(0, 16)) + '</td></tr>';
                    });
                    html += '</tbody></table>';
                }

                content.textContent = '';
                content.innerHTML = html;
            } catch (e) {
                content.textContent = '加载失败: ' + e.message;
            }
        }

        function closeHistory() {
            document.getElementById('history-modal').classList.remove('show');
        }

        async function clearHistory() {
            if (!confirm('确定清空所有历史记录?')) return;
            await BenchmarkStore.clear('results');
            await BenchmarkStore.clear('votes');
            await BenchmarkStore.clear('generations');
            closeHistory();
            setStatus('历史记录已清空');
        }

        // ===== 统计面板 =====
        async function showStats() {
            document.getElementById('stats-modal').classList.add('show');
            var content = document.getElementById('stats-content');
            content.textContent = '加载中...';

            try {
                var generations = await BenchmarkStore.getAll('generations');

                if (generations.length === 0) {
                    content.textContent = '暂无生成记录';
                    return;
                }

                var stats = {};
                generations.forEach(function(g) {
                    var mid = g.model_id || 'unknown';
                    if (!stats[mid]) {
                        stats[mid] = {
                            model_name: getModelDisplayName(mid, g.model_name || mid),
                            count: 0,
                            totalLatency: 0,
                            totalInputTokens: 0,
                            totalOutputTokens: 0,
                            totalTokens: 0,
                        };
                    }
                    stats[mid].count++;
                    stats[mid].totalLatency += g.elapsed_seconds || 0;
                    stats[mid].totalInputTokens += g.input_tokens || 0;
                    stats[mid].totalOutputTokens += g.output_tokens || 0;
                    stats[mid].totalTokens += g.total_tokens || 0;
                });

                var modelIds = Object.keys(stats).sort();

                var html = '<table class="w-full text-sm border-collapse">';
                html += '<thead><tr style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;" style="background:var(--bg-elevated); color:var(--accent); font-size:10px;">';
                html += '<th class="border px-3 py-2 text-left">模型</th>';
                html += '<th class="border px-3 py-2 text-right">生成次数</th>';
                html += '<th class="border px-3 py-2 text-right">平均耗时</th>';
                html += '<th class="border px-3 py-2 text-right">总 Input Tokens</th>';
                html += '<th class="border px-3 py-2 text-right">总 Output Tokens</th>';
                html += '<th class="border px-3 py-2 text-right">总 Tokens</th>';
                html += '</tr></thead><tbody>';

                var grandTotal = { count: 0, latency: 0, input: 0, output: 0, total: 0 };

                modelIds.forEach(function(mid) {
                    var s = stats[mid];
                    var avgLatency = s.count > 0 ? (s.totalLatency / s.count).toFixed(1) : '0';
                    html += '<tr>';
                    html += '<td class="border px-3 py-2 font-medium">' + esc(s.model_name) + '</td>';
                    html += '<td class="border px-3 py-2 text-right">' + s.count + '</td>';
                    html += '<td class="border px-3 py-2 text-right">' + avgLatency + 's</td>';
                    html += '<td class="border px-3 py-2 text-right">' + s.totalInputTokens.toLocaleString() + '</td>';
                    html += '<td class="border px-3 py-2 text-right">' + s.totalOutputTokens.toLocaleString() + '</td>';
                    html += '<td class="border px-3 py-2 text-right font-semibold">' + s.totalTokens.toLocaleString() + '</td>';
                    html += '</tr>';
                    grandTotal.count += s.count;
                    grandTotal.latency += s.totalLatency;
                    grandTotal.input += s.totalInputTokens;
                    grandTotal.output += s.totalOutputTokens;
                    grandTotal.total += s.totalTokens;
                });

                html += '<tr style="background:var(--bg-surface);">';
                html += '<td class="border px-3 py-2">平均</td>';
                html += '<td class="border px-3 py-2 text-right">' + grandTotal.count + '</td>';
                var avgGrandLatency = grandTotal.count > 0 ? (grandTotal.latency / grandTotal.count).toFixed(1) : '0';
                html += '<td class="border px-3 py-2 text-right">' + avgGrandLatency + 's</td>';
                html += '<td class="border px-3 py-2 text-right">' + grandTotal.input.toLocaleString() + '</td>';
                html += '<td class="border px-3 py-2 text-right">' + grandTotal.output.toLocaleString() + '</td>';
                html += '<td class="border px-3 py-2 text-right">' + grandTotal.total.toLocaleString() + '</td>';
                html += '</tr>';

                html += '</tbody></table>';

                // Check-pass summary across all results
                var results = await BenchmarkStore.getAll('results');
                var checkStats = {};
                results.forEach(function(r) {
                    var scores = r.model_scores || [];
                    scores.forEach(function(ms) {
                        if (!checkStats[ms.model_id]) {
                            checkStats[ms.model_id] = { model_name: ms.model_name, total_pass: 0, total_partial: 0, total_fail: 0, total_checks: 0, count: 0 };
                        }
                        checkStats[ms.model_id].total_pass += ms.pass_count || 0;
                        checkStats[ms.model_id].total_partial += ms.partial_count || 0;
                        checkStats[ms.model_id].total_fail += ms.fail_count || 0;
                        checkStats[ms.model_id].total_checks += (ms.pass_count || 0) + (ms.partial_count || 0) + (ms.fail_count || 0);
                        checkStats[ms.model_id].count++;
                    });
                });

                var statKeys = Object.keys(checkStats);
                if (statKeys.length > 0) {
                    html += '<h4 style="font-size:13px; font-weight:600; color:var(--text-primary); margin:16px 0 8px 0;">检查点通过率汇总</h4>';
                    html += '<table class="w-full text-sm border-collapse">';
                    html += '<thead><tr style="border:1px solid var(--border-default); padding:2px 6px; text-align:center;" style="background:var(--bg-elevated); color:var(--accent); font-size:10px;"><th class="border px-3 py-2 text-left">模型</th><th class="border px-3 py-2 text-right">评分次数</th><th class="border px-3 py-2 text-right">通过</th><th class="border px-3 py-2 text-right">部分</th><th class="border px-3 py-2 text-right">失败</th><th class="border px-3 py-2 text-right">通过率</th></tr></thead><tbody>';
                    statKeys.forEach(function(mid) {
                        var cs = checkStats[mid];
                        var rate = cs.total_checks > 0 ? ((cs.total_pass + cs.total_partial * 0.5) / cs.total_checks * 100).toFixed(1) : '0';
                        html += '<tr><td class="border px-3 py-2 font-medium">' + esc(cs.model_name) + '</td>';
                        html += '<td class="border px-3 py-2 text-right">' + cs.count + '</td>';
                        html += '<td class="border px-3 py-2 text-right" style="color:#22c55e">' + cs.total_pass + '</td>';
                        html += '<td class="border px-3 py-2 text-right" style="color:#eab308">' + cs.total_partial + '</td>';
                        html += '<td class="border px-3 py-2 text-right" style="color:#ef4444">' + cs.total_fail + '</td>';
                        html += '<td class="border px-3 py-2 text-right font-semibold">' + rate + '%</td></tr>';
                    });
                    html += '</tbody></table>';
                }

                html += '<p style="font-size:11px; color:var(--text-muted); margin-top:12px;">共 ' + generations.length + ' 次生成</p>';

                content.textContent = '';
                content.innerHTML = html;
            } catch (e) {
                content.textContent = '加载失败: ' + e.message;
            }
        }

        function closeStats() {
            document.getElementById('stats-modal').classList.remove('show');
        }

        // ===== 初始化 =====
        window.onload = async function() {
            await loadData();
            loadApiConfig();
            rebuildPanes();
            renderList();
            await restoreSession();
            if (!activeSession) {
                setStatus('就绪 | 模型: ' + MODELS.map(function(m) { return getModelDisplayName(m.id, m.name); }).join(', '));
            }
        };
    </script>
