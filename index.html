<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bench — LLM 模型对比评测</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="./lib/store.js"></script>
    <style>
        :root {
            --bg-0: #09090b;
            --bg-1: #0f0f12;
            --bg-2: #16161a;
            --bg-3: #1c1c22;
            --bg-4: #24242c;
            --bg-5: #2e2e38;
            --border-1: rgba(255,255,255,0.06);
            --border-2: rgba(255,255,255,0.10);
            --border-3: rgba(255,255,255,0.16);
            --text-1: #fafafa;
            --text-2: #a1a1aa;
            --text-3: #52525b;
            --accent: #22d3ee;
            --accent-dim: rgba(34,211,238,0.10);
            --accent-glow: rgba(34,211,238,0.20);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.10);
            --amber: #fbbf24;
            --amber-dim: rgba(251,191,36,0.10);
            --red: #f87171;
            --red-dim: rgba(248,113,113,0.10);
            --purple: #a78bfa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg-0); color: var(--text-1);
            font-family: 'Geist', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
        ::selection { background: var(--accent-dim); color: var(--accent); }

        .app-header {
            height: 48px; flex-shrink: 0;
            background: rgba(15,15,18,0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-1);
            display: flex; align-items: center;
            padding: 0 16px; gap: 4px; z-index: 40;
            transition: border-bottom-color 0.3s;
        }
        .app-logo {
            font-family: 'Instrument Serif', serif;
            font-size: 20px; color: var(--text-1);
            margin-right: 8px; user-select: none; cursor: default;
        }
        .app-logo span { color: var(--accent); }

        .header-tabs { display: flex; gap: 0; margin-left: 8px; }
        .header-tab {
            padding: 6px 14px; font-size: 13px; font-weight: 400;
            color: var(--text-3); border: none; background: none;
            cursor: pointer; border-bottom: 2px solid transparent;
            transition: all 0.15s; font-family: inherit; margin-bottom: -1px;
        }
        .header-tab:hover { color: var(--text-2); }
        .header-tab.active { color: var(--text-1); border-bottom-color: var(--accent); font-weight: 500; }

        .header-spacer { flex: 1; }
        .hbtn {
            padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
            border: 1px solid var(--border-2); background: transparent;
            color: var(--text-2); cursor: pointer; transition: all 0.15s; font-family: inherit;
        }
        .hbtn:hover { background: var(--bg-3); color: var(--text-1); border-color: var(--border-3); }
        .hbtn.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .hbtn.primary { background: var(--accent); color: var(--bg-0); border-color: var(--accent); font-weight: 600; }
        .hbtn.primary:hover { opacity: 0.85; }
        .hbtn:disabled { opacity: 0.35; cursor: not-allowed; }
        .hbtn.danger:hover { background: var(--red-dim); border-color: var(--red); color: var(--red); }

        .app-body { flex: 1; display: flex; overflow: hidden; }
        .tab-view { display: none; width: 100%; height: 100%; }
        .tab-view.active { display: flex; }

        /* Compare view */
        .compare-view { display: flex; overflow: hidden; width: 100%; height: 100%; }
        .tc-sidebar {
            width: 248px; flex-shrink: 0; border-right: 1px solid var(--border-1);
            display: flex; flex-direction: column; background: var(--bg-1);
            transition: width 0.25s ease, opacity 0.25s ease, border 0.25s ease;
            overflow: hidden;
        }
        .tc-sidebar.collapsed { width: 0; opacity: 0; border-right: none; }
        .tc-sidebar-header {
            padding: 10px 12px; border-bottom: 1px solid var(--border-1);
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .tc-sidebar-header-left { display: flex; align-items: center; gap: 6px; }
        .add-prompt-btn {
            width: 20px; height: 20px; border-radius: 4px; border: 1px dashed var(--border-2);
            background: none; color: var(--text-3); cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center; transition: all 0.15s;
            line-height: 1; padding: 0;
        }
        .add-prompt-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .tc-item.custom .tc-id { background: var(--amber-dim); color: var(--amber); }
        .tc-item .tc-del {
            width: 18px; height: 18px; border-radius: 3px; border: none;
            background: none; color: var(--text-3); cursor: pointer; font-size: 12px;
            display: none; align-items: center; justify-content: center; transition: color 0.12s; padding: 0;
        }
        .tc-item:hover .tc-del { display: flex; }
        .tc-item .tc-del:hover { color: var(--red); }
        .tc-sidebar-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
        .tc-count { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--text-3); background: var(--bg-3); padding: 2px 7px; border-radius: 4px; }
        .tc-list { flex: 1; overflow-y: auto; padding: 4px; }
        .tc-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 6px; cursor: pointer;
            transition: all 0.12s; margin-bottom: 1px; position: relative;
        }
        .tc-item:hover { background: var(--bg-2); }
        .tc-item.active { background: var(--accent-dim); }
        .tc-item.active::before {
            content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
            width: 2px; border-radius: 1px; background: var(--accent);
        }
        .tc-check {
            width: 14px; height: 14px; border-radius: 3px;
            border: 1.5px solid var(--border-2); flex-shrink: 0;
            appearance: none; -webkit-appearance: none; cursor: pointer;
            transition: all 0.15s; background: transparent; position: relative;
        }
        .tc-check:checked { background: var(--accent); border-color: var(--accent); }
        .tc-check:checked::after {
            content: ''; position: absolute; left: 3.5px; top: 1px;
            width: 4px; height: 7px; border: solid var(--bg-0);
            border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
        }
        .tc-info { flex: 1; min-width: 0; }
        .tc-name { font-size: 13px; font-weight: 500; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tc-item.scored .tc-name::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-left: 6px; vertical-align: middle; }
        .tc-dim { font-size: 11px; color: var(--text-3); margin-top: 1px; }
        .tc-id { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--text-3); background: var(--bg-3); padding: 2px 5px; border-radius: 3px; flex-shrink: 0; }
        .tc-batch { padding: 8px 10px; border-top: 1px solid var(--border-1); flex-shrink: 0; }
        .batch-btn {
            width: 100%; padding: 7px; border-radius: 6px; font-size: 12px; font-weight: 500;
            border: 1px solid var(--border-2); background: var(--bg-3); color: var(--text-2);
            cursor: pointer; transition: all 0.15s; font-family: inherit;
        }
        .batch-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .batch-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .batch-progress { margin-top: 8px; }
        .batch-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .batch-progress-text { font-size: 11px; color: var(--text-3); font-family: 'Geist Mono', monospace; }
        .batch-bar { height: 3px; border-radius: 2px; background: var(--bg-4); overflow: hidden; }
        .batch-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.4s ease; }
        .batch-detail { font-size: 10px; color: var(--text-3); font-family: 'Geist Mono', monospace; margin-top: 4px; max-height: 60px; overflow-y: auto; }
        .batch-detail-item { padding: 1px 0; }
        .batch-detail-item.done { color: var(--green); }
        .batch-detail-item.fail { color: var(--red); }
        .batch-detail-item.active { color: var(--accent); }

        /* Compare area */
        .compare-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .compare-toolbar {
            display: flex; align-items: center; gap: 8px; padding: 6px 12px;
            border-bottom: 1px solid var(--border-1); background: var(--bg-1);
        }
        .toolbar-label { font-size: 11px; color: var(--text-3); font-family: 'Geist Mono', monospace; }
        .toolbar-select {
            padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border-2);
            background: var(--bg-2); color: var(--text-1); font-size: 12px; font-family: 'Geist Mono', monospace;
        }
        .toolbar-select:focus { border-color: var(--accent); outline: none; }
        .toolbar-divider { width: 1px; height: 18px; background: var(--border-2); margin: 0 4px; }
        .gen-btn { padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; background: var(--accent); color: var(--bg-0); cursor: pointer; font-family: inherit; transition: all 0.15s; }
        .gen-btn:hover { opacity: 0.85; }
        .gen-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .icon-btn { background: none; border: none; color: var(--text-3); cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .icon-btn:hover { color: var(--text-2); background: var(--bg-3); }
        .icon-btn svg { width: 16px; height: 16px; }
        .drawer-toggle { padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .drawer-toggle:hover { background: var(--bg-3); color: var(--text-1); }
        .drawer-toggle.open { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

        /* Split panes */
        .split-panes { flex: 1; display: flex; overflow: hidden; min-height: 0; min-width: 0; }
        .pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-1); min-width: 0; position: relative; }
        .pane:last-child { border-right: none; }
        .pane-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 5px 12px; border-bottom: 1px solid var(--border-1); background: var(--bg-2);
        }
        .pane-left { display: flex; align-items: center; gap: 6px; }
        .pane-model-name { font-size: 12px; font-weight: 500; color: var(--text-2); }
        .pane-actions { display: flex; align-items: center; gap: 6px; }
        .pane-tab {
            padding: 3px 8px; border-radius: 4px; font-size: 11px; color: var(--text-3);
            border: none; background: none; cursor: pointer; transition: all 0.12s; font-family: inherit;
        }
        .pane-tab:hover { color: var(--text-2); }
        .pane-tab.active { background: var(--bg-4); color: var(--text-1); }
        .pane-action { background: none; border: none; font-size: 11px; color: var(--text-3); cursor: pointer; padding: 2px 4px; font-family: inherit; transition: color 0.15s; }
        .pane-action:hover { color: var(--accent); }
        .pane-stats { font-size: 11px; color: var(--text-3); font-family: 'Geist Mono', monospace; }
        .pane-body { flex: 1; background: var(--bg-0); position: relative; overflow: hidden; min-height: 0; }
        .pane-body::before {
            content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background-image: radial-gradient(circle, var(--border-1) 0.8px, transparent 0.8px);
            background-size: 24px 24px; opacity: 0.5;
        }
        .pane-body.has-content::before { opacity: 0; }
        .pane-placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-3); text-align: center; padding: 20px; gap: 12px;
            position: relative; z-index: 1;
        }
        .pane-placeholder .ph-icon-wrap {
            width: 56px; height: 56px; border-radius: 14px; position: relative;
            background: var(--bg-2); border: 1px solid var(--border-1);
            display: flex; align-items: center; justify-content: center;
        }
        .pane-placeholder .ph-icon-wrap::after {
            content: ''; position: absolute; inset: -1px; border-radius: 15px;
            background: radial-gradient(ellipse at center, var(--accent-dim) 0%, transparent 70%);
            opacity: 0; animation: phPulse 3s ease-in-out infinite;
        }
        .pane-placeholder .ph-icon-wrap svg { opacity: 0.35; position: relative; z-index: 1; }
        .pane-placeholder p { font-size: 13px; font-weight: 500; color: var(--text-3); }
        .pane-placeholder .hint { font-size: 11px; color: var(--text-3); opacity: 0.5; margin-top: -4px; }
        @keyframes phPulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.6; }
        }
        .pane-iframe { width: 100%; height: 100%; border: none; display: none; }
        .pane-loading {
            position: absolute; inset: 0; display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; z-index: 10;
            background: var(--bg-0);
        }
        .pane-loading::before {
            content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background-image: radial-gradient(circle, var(--border-1) 0.8px, transparent 0.8px);
            background-size: 24px 24px; opacity: 0.3;
        }
        .pane-loading.show { display: flex; }
        .spinner-wrap { position: relative; width: 40px; height: 40px; z-index: 1; }
        .spinner { width: 40px; height: 40px; border: 2px solid var(--bg-4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
        .spinner-wrap::after {
            content: ''; position: absolute; inset: -8px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
            animation: loadGlow 1.5s ease-in-out infinite alternate;
        }
        @keyframes loadGlow { from { opacity: 0.3; } to { opacity: 0.8; } }
        .loading-text { font-size: 12px; color: var(--text-3); font-family: 'Geist Mono', monospace; z-index: 1; }
        .loading-bar { width: 120px; height: 2px; border-radius: 1px; background: var(--bg-4); overflow: hidden; z-index: 1; }
        .loading-bar-fill { height: 100%; border-radius: 1px; background: var(--accent); animation: loadSlide 1.2s ease-in-out infinite; }
        @keyframes loadSlide { 0% { width: 0%; margin-left: 0; } 50% { width: 60%; margin-left: 20%; } 100% { width: 0%; margin-left: 100%; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pane-source { position: absolute; inset: 0; display: none; background: var(--bg-1); overflow: auto; padding: 16px; z-index: 8; }
        .pane-source.show { display: block; }
        .pane-source pre { margin: 0; border-radius: 8px; border: 1px solid var(--border-1); }
        .pane-source code { font-size: 12px; line-height: 1.6; font-family: 'Geist Mono', monospace; }
        .pane-code-input { position: absolute; inset: 0; display: none; background: var(--bg-1); padding: 16px; z-index: 12; flex-direction: column; }
        .pane-code-input.show { display: flex; }
        .code-textarea { flex: 1; width: 100%; padding: 12px; font-family: 'Geist Mono', monospace; font-size: 13px; border: 1px solid var(--border-2); border-radius: 8px; resize: none; background: var(--bg-2); color: var(--text-1); }
        .code-textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-dim); }
        .code-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

        /* Score drawer */
        .score-drawer {
            width: 320px; flex-shrink: 0; border-left: 1px solid var(--border-1);
            background: var(--bg-1); display: flex; flex-direction: column; overflow: hidden;
            transition: width 0.25s ease, opacity 0.25s ease;
        }
        .score-drawer.closed { width: 0; min-width: 0; opacity: 0; border-left: none; overflow: hidden; padding: 0; }
        .drawer-header { padding: 12px 14px; border-bottom: 1px solid var(--border-1); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .drawer-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
        .drawer-close { width: 24px; height: 24px; border-radius: 5px; border: none; background: none; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.15s; }
        .drawer-close:hover { background: var(--bg-3); color: var(--text-1); }
        .drawer-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
        .drawer-footer { padding: 10px 14px; border-top: 1px solid var(--border-1); flex-shrink: 0; }
        .save-btn { width: 100%; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; background: var(--accent); color: var(--bg-0); cursor: pointer; font-family: inherit; transition: all 0.15s; }
        .save-btn:hover { opacity: 0.85; }
        .save-btn.saved { background: var(--green); pointer-events: none; }
        @keyframes savePop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
        .save-btn.saved { animation: savePop 0.3s ease; }

        .prompt-card { background: var(--bg-2); padding: 12px; border-radius: 8px; border: 1px solid var(--border-1); margin-bottom: 16px; }
        .prompt-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .dim-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: var(--accent-dim); color: var(--accent); font-family: 'Geist Mono', monospace; }
        .id-badge { font-size: 11px; color: var(--text-3); font-family: 'Geist Mono', monospace; }
        .prompt-card-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .prompt-card-text { font-size: 12px; color: var(--text-2); line-height: 1.6; max-height: 120px; overflow-y: auto; margin-bottom: 8px; }
        .copy-btn { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px; font-family: inherit; }
        .copy-btn:hover { opacity: 0.7; }

        .score-section-title { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .score-model-divider { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px; }
        .score-model-divider span { font-size: 11px; font-weight: 600; color: var(--accent); font-family: 'Geist Mono', monospace; }
        .score-model-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-1); }
        .score-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .score-label { font-size: 12px; color: var(--text-2); flex: 1; line-height: 1.4; }
        .score-btns { display: flex; gap: 2px; }
        .sc-btn { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 500; border: 1px solid var(--border-2); background: transparent; color: var(--text-3); cursor: pointer; transition: all 0.12s; font-family: inherit; }
        .sc-btn:hover { background: var(--bg-3); }
        .sc-btn.pass { background: var(--green-dim); border-color: var(--green); color: var(--green); }
        .sc-btn.partial { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
        .sc-btn.fail { background: var(--red-dim); border-color: var(--red); color: var(--red); }
        .score-comment { width: 100%; font-size: 11px; padding: 6px 8px; border: 1px solid var(--border-1); border-radius: 5px; background: var(--bg-2); color: var(--text-1); resize: none; font-family: inherit; margin-top: 4px; }
        .score-comment:focus { border-color: var(--accent); outline: none; }

        /* Blind vote (inline in drawer) */
        .vote-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-1); }
        .vote-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .vote-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .vote-option {
            flex: 1; min-width: 80px; padding: 10px 8px; border-radius: 10px; border: 1.5px solid var(--border-2);
            background: var(--bg-2); cursor: pointer; text-align: center; transition: all 0.2s; position: relative;
        }
        .vote-option:hover { border-color: var(--border-3); background: var(--bg-3); }
        .vote-option.selected { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 16px var(--accent-glow); }
        .vote-option .vo-letter { font-size: 16px; font-weight: 600; color: var(--text-2); display: block; margin-bottom: 2px; }
        .vote-option.selected .vo-letter { color: var(--accent); }
        .vote-option .vo-label { font-size: 10px; color: var(--text-3); }
        .vote-tie { width: 100%; margin-top: 8px; padding: 7px; border-radius: 7px; font-size: 12px; font-weight: 500; border: 1px solid var(--border-2); background: transparent; color: var(--text-3); cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .vote-tie:hover { background: var(--bg-3); color: var(--text-1); }
        .vote-result { margin-top: 10px; padding: 8px 10px; border-radius: 7px; font-size: 12px; text-align: center; }
        .vote-result.pending { background: var(--bg-3); color: var(--text-3); }
        .vote-result.done { background: var(--green-dim); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }
        .blind-reveal { animation: revealName 0.6s ease-out; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(9,9,11,0.7); backdrop-filter: blur(4px); }
        .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
        .modal-card { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 14px; box-shadow: 0 12px 48px rgba(0,0,0,0.4); max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 0.25s ease-out; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-1); }
        .modal-header h3 { font-size: 15px; font-weight: 600; margin: 0; }
        .modal-close { background: none; border: none; color: var(--text-3); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; transition: color 0.15s; }
        .modal-close:hover { color: var(--text-1); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border-1); }
        .modal-label { font-size: 11px; font-weight: 600; color: var(--text-3); margin-bottom: 6px; display: block; font-family: 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: 0.3px; }
        .modal-select { width: 100%; padding: 8px 10px; border: 1px solid var(--border-2); border-radius: 6px; font-size: 13px; background: var(--bg-1); color: var(--text-1); margin-bottom: 14px; font-family: inherit; }
        .modal-select:focus { border-color: var(--accent); outline: none; }
        .modal-textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-2); border-radius: 6px; font-size: 13px; background: var(--bg-1); color: var(--text-1); margin-bottom: 14px; font-family: inherit; resize: vertical; min-height: 80px; }
        .modal-textarea:focus { border-color: var(--accent); outline: none; }
        .modal-row { display: flex; gap: 10px; }
        .modal-row > * { flex: 1; }
        .modal-error { font-size: 12px; color: var(--red); margin-bottom: 10px; display: none; padding: 6px 10px; border-radius: 5px; background: var(--red-dim); border: 1px solid rgba(248,113,113,0.2); }
        .session-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--border-2); border-radius: 8px; padding: 6px; margin-bottom: 14px; background: var(--bg-1); }
        .session-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; cursor: pointer; transition: background 0.12s; }
        .session-item:hover { background: var(--bg-3); }
        .session-item input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
        .session-item span { font-size: 13px; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .toggle-row span { font-size: 13px; color: var(--text-2); }
        .toggle-switch { position: relative; display: inline-block; width: 38px; height: 21px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; inset: 0; cursor: pointer; background: var(--bg-4); border: 1px solid var(--border-2); border-radius: 21px; transition: all 0.25s ease; }
        .toggle-slider::before { content: ''; position: absolute; width: 15px; height: 15px; left: 2px; bottom: 2px; background: var(--text-3); border-radius: 50%; transition: all 0.25s ease; }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent-dim); border-color: var(--accent); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(17px); background: var(--accent); }

        /* API dropdown */
        .api-dropdown {
            display: none; position: fixed; top: 48px; right: 16px; width: 380px;
            background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); padding: 16px; z-index: 100;
            max-height: calc(100vh - 72px); overflow-y: auto; animation: fadeIn 0.15s ease-out;
        }
        .api-dropdown.show { display: block; }
        .api-dropdown label { display: block; font-size: 11px; font-weight: 600; color: var(--text-3); margin-bottom: 4px; margin-top: 10px; font-family: 'Geist Mono', monospace; }
        .api-dropdown label:first-child { margin-top: 0; }
        .api-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border-2); border-radius: 6px; font-size: 13px; background: var(--bg-1); color: var(--text-1); font-family: 'Geist', sans-serif; }
        .api-input:focus { border-color: var(--accent); outline: none; }
        .provider-preset { display: inline-block; padding: 3px 8px; margin: 2px; border: 1px solid var(--border-2); border-radius: 10px; font-size: 11px; cursor: pointer; background: transparent; color: var(--text-3); transition: all 0.15s; font-family: inherit; }
        .provider-preset:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .cm-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--border-1); border-radius: 7px; margin-bottom: 5px; background: var(--bg-1); }
        .cm-item .info { flex: 1; min-width: 0; }
        .cm-item .name { font-size: 13px; font-weight: 500; }
        .cm-item .meta { font-size: 11px; color: var(--text-3); margin-top: 1px; }
        .cm-del { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 11px; padding: 2px 6px; border-radius: 4px; transition: all 0.15s; font-family: inherit; }
        .cm-del:hover { background: var(--red-dim); color: var(--red); }

        /* Stats / History */
        .full-view { flex: 1; overflow-y: auto; padding: 24px 32px; max-width: 1100px; margin: 0 auto; width: 100%; }
        .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .view-title { font-size: 20px; font-weight: 600; }
        .view-subtitle { font-size: 13px; color: var(--text-3); margin-top: 4px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid var(--border-2); background: var(--bg-1); }
        .data-table th.n { text-align: right; }
        .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border-1); color: var(--text-2); }
        .data-table td.n { text-align: right; font-family: 'Geist Mono', monospace; }
        .data-table td.mn { font-weight: 500; color: var(--text-1); }
        .data-table tr:hover td { background: var(--bg-2); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .badge-g { background: var(--green-dim); color: var(--green); }
        .badge-a { background: var(--accent-dim); color: var(--accent); }
        .badge-w { background: var(--amber-dim); color: var(--amber); }
        .badge-r { background: var(--red-dim); color: var(--red); }
        .hcard { background: var(--bg-2); border: 1px solid var(--border-1); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; transition: border-color 0.15s; }
        .hcard:hover { border-color: var(--border-2); }
        .hcard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hcard-name { font-size: 14px; font-weight: 500; }
        .hcard-time { font-size: 11px; color: var(--text-3); font-family: 'Geist Mono', monospace; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-3); }
        .empty-state svg { margin-bottom: 12px; opacity: 0.3; }
        .empty-state p { font-size: 13px; }

        /* Status bar */
        .status-bar { height: 26px; flex-shrink: 0; background: var(--bg-2); border-top: 1px solid var(--border-1); display: flex; align-items: center; padding: 0 14px; gap: 16px; }
        .status-item { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); transition: all 0.3s; }
        .status-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes revealName { from { opacity: 0; transform: translateY(6px); color: var(--accent); } to { opacity: 1; transform: translateY(0); color: var(--text-1); } }

        @media (max-width: 1024px) {
            .split-panes { flex-direction: column; }
            .pane { border-right: none; border-bottom: 1px solid var(--border-1); }
        }
    </style>
</head>

<script>
function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

var MODELS=[],promptsData=[],currentPrompt=null;
var batchGeneratedIds=[];
var scoredPromptIds=new Set();
var promptCache={};
var PROXY_URL='/v1/chat/completions',CLAUDE_URL='/v1/claude-code';
var CLAUDE_MODELS=new Set(['claude-opus-4-7','claude-sonnet-4-6','claude-haiku-4-5-20251001']);
var CLAUDE_DISPLAY_NAME={'claude-opus-4-7':'GLM-5.1 (Opus)','claude-sonnet-4-6':'GLM-5-Turbo (Sonnet)','claude-haiku-4-5-20251001':'GLM-4.7 (Haiku)'};
function isClaudeModel(id){return CLAUDE_MODELS.has(id);}
function getModelDisplayName(id,fb){return CLAUDE_DISPLAY_NAME[id]||fb||id;}

function switchTab(id){
    document.querySelectorAll('.header-tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===id);});
    document.querySelectorAll('.tab-view').forEach(function(v){v.classList.toggle('active',v.id==='tab-'+id);});
    if(id==='stats')loadStats();if(id==='history')loadHistory();
}
function toggleSidebar(){document.getElementById('tc-sidebar').classList.toggle('collapsed');}

var scoreDrawerOpen=false;
function toggleScoreDrawer(){
    scoreDrawerOpen=!scoreDrawerOpen;
    document.getElementById('score-drawer').classList.toggle('closed',!scoreDrawerOpen);
    document.getElementById('drawer-toggle').classList.toggle('open',scoreDrawerOpen);
}

async function loadData(){
    try{var r=await fetch('./prompts.json');var d=await r.json();MODELS=d.models||[];promptsData=d.prompts||[];}catch(e){console.error(e);promptsData=[];}
    var customPrompts=getCustomPrompts();
    customPrompts.forEach(function(cp){if(!promptsData.find(function(p){return p.id===cp.id;}))promptsData.push(cp);});
    document.querySelector('.tc-count').textContent=promptsData.length;
}

var PROVIDER_PRESETS=[{name:'OpenAI',baseUrl:'https://api.openai.com/v1'},{name:'DeepSeek',baseUrl:'https://api.deepseek.com/v1'},{name:'Gemini',baseUrl:'https://generativelanguage.googleapis.com/v1beta/openai'},{name:'Anthropic',baseUrl:'https://api.anthropic.com/v1'},{name:'智谱 GLM',baseUrl:'https://open.bigmodel.cn/api/paas/v4'},{name:'通义千问',baseUrl:'https://dashscope.aliyuncs.com/compatible-mode/v1'},{name:'Groq',baseUrl:'https://api.groq.com/openai/v1'},{name:'Together',baseUrl:'https://api.together.xyz/v1'},{name:'Mistral',baseUrl:'https://api.mistral.ai/v1'},{name:'硅基流动',baseUrl:'https://api.siliconflow.cn/v1'},{name:'OpenRouter',baseUrl:'https://openrouter.ai/api/v1'},{name:'自定义',baseUrl:''}];
var CUSTOM_KEY='benchmark_custom_models',SESSION_KEY='benchmark_active_session_id';
var CUSTOM_PROMPTS_KEY='benchmark_custom_prompts';
function getCustomModels(){try{return JSON.parse(localStorage.getItem(CUSTOM_KEY))||[];}catch(e){return[];}}
function saveCustomModels(m){localStorage.setItem(CUSTOM_KEY,JSON.stringify(m));}
function getCustomPrompts(){try{return JSON.parse(localStorage.getItem(CUSTOM_PROMPTS_KEY))||[];}catch(e){return[];}}
function saveCustomPrompts(p){localStorage.setItem(CUSTOM_PROMPTS_KEY,JSON.stringify(p));}
function getAllModels(){return MODELS.concat(getCustomModels());}
function getCustomModelConfig(id){return getCustomModels().find(function(m){return m.id===id;})||null;}

function loadApiConfig(){
    var el=document.getElementById('provider-presets');el.textContent='';
    PROVIDER_PRESETS.forEach(function(p){
        var b=document.createElement('button');b.className='provider-preset';b.textContent=p.name;
        b.onclick=function(){if(p.baseUrl)document.getElementById('custom-base-url').value=p.baseUrl;document.getElementById('custom-model-id').focus();};
        el.appendChild(b);
    });
    renderCustomModelList();
}
function renderCustomModelList(){
    var el=document.getElementById('custom-model-list');el.textContent='';
    getCustomModels().forEach(function(m){
        var item=document.createElement('div');item.className='cm-item';
        var info=document.createElement('div');info.className='info';
        var nm=document.createElement('div');nm.className='name';nm.textContent=m.display_name||m.id;
        var mt=document.createElement('div');mt.className='meta';
        try{mt.textContent=m.id+' @ '+new URL(m.base_url).hostname;}catch(e){mt.textContent=m.id;}
        info.appendChild(nm);info.appendChild(mt);
        var del=document.createElement('button');del.className='cm-del';del.textContent='删除';
        del.onclick=function(){removeCustomModel(m.id);};
        item.appendChild(info);item.appendChild(del);el.appendChild(item);
    });
}
async function addCustomModel(){
    if(activeSession){alert('会话期间无法添加');return;}
    var baseUrl=document.getElementById('custom-base-url').value.trim();
    var apiKey=document.getElementById('custom-api-key').value.trim();
    var modelId=document.getElementById('custom-model-id').value.trim();
    var displayName=document.getElementById('custom-model-name').value.trim()||modelId;
    if(!baseUrl||!apiKey||!modelId){alert('请填写完整');return;}
    try{var h=new URL(baseUrl).hostname;await fetch('/v1/hosts/allow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostname:h})});}catch(e){}

function extractHtml(text){
    var m=text.match(/```html\s*\n([\s\S]*?)```/i);if(m)return m[1].trim();
    m=text.match(/```\s*\n([\s\S]*?)```/);if(m){var c=m[1].trim();if(c.toLowerCase().indexOf('<!doctype')!==-1||c.toLowerCase().indexOf('<html')!==-1)return c;}
    var t=text.trim();if(t.toLowerCase().indexOf('<!doctype')===0||t.toLowerCase().indexOf('<html')===0)return t;
    m=text.match(/(<html[\s\S]*<\/html>)/i);if(m)return m[1].trim();return null;
}

async function generate(pid,promptOverride){
    var prompt=promptOverride||currentPrompt;
    if(!prompt){alert('请先选择测试用例');return;}
    var sel=document.getElementById('select-'+pid);var modelId=sel?sel.value:'';if(!modelId){setStatus('请选择模型');return;}

        var req={model:modelId,messages:[{role:'system',content:sys},{role:'user',content:prompt.prompt}],max_tokens:16384,temperature:0.7,stream:true};

                if(delta&&delta.content){full+=delta.content;lt.textContent='生成中... '+full.length+' 字符';var sc=document.getElementById('source-code-'+pid);if(sc)sc.textContent=full;}
                if(p.usage){inTok=p.usage.prompt_tokens||0;outTok=p.usage.completion_tokens||0;}}catch(e){}
            }
            if(done)break;
        }
        var elapsed=((performance.now()-t0)/1000).toFixed(1),total=inTok+outTok,speed=elapsed>0?(outTok/parseFloat(elapsed)).toFixed(1):'0';
        se.textContent=elapsed+'s | '+total+' tok | '+speed+' tok/s';if(!batchRunning)setStatus(modelName+' 完成 '+elapsed+'s');

        if(!promptCache[prompt.id])promptCache[prompt.id]={};

async function startBatchRun(){
    if(batchRunning)return;var ids=getSelectedIds();if(!ids.length){alert('请先勾选测试用例');return;}
    batchRunning=true;batchQueue=ids.slice();batchDone=0;batchErrors=0;batchGeneratedIds=[];scoredPromptIds=new Set();promptCache={};
    var btn=document.getElementById('batch-run-btn');btn.disabled=true;btn.textContent='运行中...';
    var pe=document.getElementById('batch-progress'),detail=document.getElementById('batch-detail');
    pe.style.display='block';if(detail)detail.textContent='';
    var first=promptsData.find(function(p){return p.id===ids[0];});if(first)selectPrompt(first,null);
    updateBatchUI(ids.length);
    setStatus('批量运行中... 0/'+ids.length);
    var paneCount=parseInt(document.getElementById('pane-count').value);
    var concurrency=Math.min(paneCount,ids.length);
    var queue=[];
    ids.forEach(function(id){var pr=promptsData.find(function(p){return p.id===id;});if(pr)queue.push(pr);});
    async function runNext(){
        while(true){
            var pr=queue.shift();
            if(!pr)break;
            var detailEl=document.getElementById('batch-detail');
            if(detailEl){var di=document.createElement('div');di.className='batch-detail-item active';di.id='bd-'+pr.id;di.textContent=pr.name+' ...';detailEl.appendChild(di);}
            try{for(var p=0;p<paneCount;p++)await generate(String(p),pr);
            batchDone++;batchGeneratedIds.push(pr.id);
            if(detailEl){var di2=document.getElementById('bd-'+pr.id);if(di2){di2.className='batch-detail-item done';di2.textContent=pr.name+' ✓';}}
            }catch(e){batchErrors++;console.error('Batch error for '+pr.name,e);
            if(detailEl){var di3=document.getElementById('bd-'+pr.id);if(di3){di3.className='batch-detail-item fail';di3.textContent=pr.name+' ✗';}}}
            updateBatchUI(ids.length);
            setStatus('批量运行中... '+(batchDone+batchErrors)+'/'+ids.length);
        }
    }
    var workers=[];for(var w=0;w<concurrency;w++)workers.push(runNext());
    await Promise.all(workers);
    setStatus('批量完成: '+batchDone+'/'+ids.length+' 成功'+(batchErrors?' — '+batchErrors+' 错误':'')+' — 请逐个评分');
    if(batchGeneratedIds.length&&!scoreDrawerOpen)toggleScoreDrawer();
    batchRunning=false;btn.disabled=false;btn.textContent='批量运行';
    if(batchGeneratedIds.length){var lp=promptsData.find(function(p){return p.id===batchGeneratedIds[batchGeneratedIds.length-1];});if(lp)selectPrompt(lp,document.querySelector('.tc-item[data-prompt-id="'+lp.id+'"]'));}
}

    if(votes.length){h+='<h3 style="font-size:14px;font-weight:600;margin:20px 0 12px;color:var(--text-2);">投票记录</h3>';
    votes.slice().reverse().forEach(function(v){var wl='平局';if(v.winner&&v.winner!=='tie'){var wm=MODELS.find(function(m){return m.id===v.winner;});wl=esc(wm?getModelDisplayName(wm.id,wm.name):v.winner)+' 胜';}
    var ml=(v.models||[]).map(function(mid){var m=MODELS.find(function(m){return m.id===mid;});return esc(m?getModelDisplayName(m.id,m.name):mid);}).join(' vs ');
    h+='<div class="hcard"><div class="hcard-header"><span class="hcard-name">'+esc(v.prompt_name||v.prompt_id)+'</span><span class="badge badge-g">'+wl+'</span></div><div style="font-size:11px;color:var(--text-3);margin-top:4px;">'+ml+' · '+esc((v.timestamp||'').slice(0,16).replace('T',' '))+'</div></div>';});}
    ct.textContent='';ct.insertAdjacentHTML('beforeend',h);}catch(e){ct.textContent='';ct.appendChild(createEmptyState('加载失败'));}}

async function clearHistory(){
    if(!confirm('确定清空所有历史记录?'))return;
    await BenchmarkStore.clear('results');await BenchmarkStore.clear('votes');await BenchmarkStore.clear('generations');
    loadHistory();setStatus('历史记录已清空');
}

window.onload=async function(){
    await loadData();loadApiConfig();rebuildPanes();renderList();await restoreSession();
    if(!activeSession)setStatus('就绪 | '+MODELS.map(function(m){return getModelDisplayName(m.id,m.name);}).join(', '));
};
</script>
