<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bench — LLM 模型对比评测</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./lib/store.js"></script>
</head>
<body>
<header class="app-header" id="app-header">
    <div class="app-logo">Bench<span>.</span></div>
    <div class="header-tabs">
        <button class="header-tab active" data-tab="compare" onclick="switchTab('compare')">对比</button>
        <button class="header-tab" data-tab="stats" onclick="switchTab('stats')">统计</button>
        <button class="header-tab" data-tab="history" onclick="switchTab('history')">历史</button>
    </div>
    <div class="header-spacer"></div>
    <button class="hbtn" id="blind-toggle" onclick="toggleBlindMode()">盲评</button>
    <button class="hbtn" id="api-config-btn" onclick="toggleApiConfig()">配置</button>
    <button class="hbtn primary" id="session-btn" onclick="openSessionModal()">新建会话</button>
    <button class="hbtn" id="end-session-btn" onclick="endSession()" style="display:none;">结束会话</button>
</header>

<div class="api-dropdown" id="api-dropdown">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:13px;font-weight:600;">API 配置</span>
        <button class="modal-close" onclick="toggleApiConfig()" style="font-size:14px;">&times;</button>
    </div>
    <p style="font-size:12px;color:var(--text-3);margin-bottom:10px;">内置模型已自动加载，下方可添加自定义模型。</p>
    <div style="margin-bottom:12px;">
        <div style="font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:6px;font-family:'Geist Mono',monospace;">OpenCode Zen（免费 API）</div>
        <div id="opencode-spawn-toggles"></div>
    </div>
    <div style="margin-bottom:12px;">
        <div style="font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:6px;font-family:'Geist Mono',monospace;">Claude Spawn（本地 CLI）</div>
        <div id="claude-spawn-toggles"></div>
    </div>
    <label>快速填充</label>
    <div id="provider-presets" style="margin-bottom:10px;"></div>
    <label>Base URL</label><input class="api-input" id="custom-base-url" placeholder="https://api.openai.com/v1">
    <label>API Key</label><input class="api-input" type="password" id="custom-api-key" placeholder="sk-...">
    <label>模型 ID</label><input class="api-input" id="custom-model-id" placeholder="gpt-4o">
    <label>显示名称</label><input class="api-input" id="custom-model-name" placeholder="GPT-4o">
    <button class="hbtn primary" style="width:100%;margin-top:12px;padding:7px;" onclick="addCustomModel()">添加模型</button>
    <div id="custom-model-list" style="margin-top:12px;"></div>
</div>

<div class="modal-overlay" id="prompt-modal">
    <div class="modal-card" style="width:500px;">
        <div class="modal-header"><h3>添加自定义用例</h3><button class="modal-close" onclick="closePromptModal()">&times;</button></div>
        <div class="modal-body">
            <label class="modal-label">用例名称</label>
            <input class="api-input" id="custom-prompt-name" placeholder="例如：响应式导航栏">
            <div class="modal-row">
                <div>
                    <label class="modal-label">维度</label>
                    <input class="api-input" id="custom-prompt-dimension" placeholder="例如：前端">
                </div>
                <div>
                    <label class="modal-label">输出类型</label>
                    <select class="modal-select" id="custom-prompt-type"><option value="html">HTML</option><option value="code">代码</option></select>
                </div>
            </div>
            <label class="modal-label">检查点（每行一个）</label>
            <textarea class="modal-textarea" id="custom-prompt-checks" rows="3" placeholder="页面正常渲染&#10;导航栏包含 3 个以上链接&#10;移动端响应式布局"></textarea>
            <label class="modal-label">提示词</label>
            <textarea class="modal-textarea" id="custom-prompt-text" rows="4" placeholder="请生成一个响应式导航栏组件..."></textarea>
            <div id="prompt-modal-error" class="modal-error"></div>
        </div>
        <div class="modal-footer"><button class="hbtn" onclick="closePromptModal()">取消</button><button class="hbtn primary" onclick="addCustomPrompt()">添加</button></div>
    </div>
</div>

<div class="modal-overlay" id="session-modal">
    <div class="modal-card" style="width:460px;">
        <div class="modal-header"><h3>新建评测会话</h3><button class="modal-close" onclick="closeSessionModal()">&times;</button></div>
        <div class="modal-body">
            <label class="modal-label">选择模型 <span style="font-weight:400;color:var(--text-3);">(至少 2 个)</span></label>
            <div id="session-model-list" class="session-list"></div>
            <div class="toggle-row"><span>启用盲评</span><label class="toggle-switch"><input type="checkbox" id="session-blind-mode"><span class="toggle-slider"></span></label></div>
            <label class="modal-label">分屏</label>
            <select id="session-pane-count" class="modal-select"><option value="2">2 分屏</option><option value="3">3 分屏</option><option value="4">4 分屏</option></select>
            <div id="session-error" class="modal-error"></div>
        </div>
        <div class="modal-footer"><button class="hbtn" onclick="closeSessionModal()">取消</button><button class="hbtn primary" onclick="startSession()">开始评测</button></div>
    </div>
</div>


<div class="app-body">
    <div class="tab-view active" id="tab-compare">
        <div class="compare-view">
            <aside class="tc-sidebar" id="tc-sidebar">
                <div class="tc-sidebar-header">
                    <div class="tc-sidebar-header-left">
                        <button class="add-prompt-btn" onclick="openPromptModal()" title="添加用例">+</button>
                        <span class="tc-sidebar-title">用例 <span class="tc-count">0</span></span>
                    </div>
                    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;color:var(--text-3);"><input type="checkbox" id="batch-select-all" onchange="toggleSelectAll(this.checked)" style="accent-color:var(--accent);"> 全选</label>
                </div>
                <div class="tc-list" id="tc-list"></div>
                <div class="tc-batch">
                    <div id="batch-progress" style="display:none;" class="batch-progress">
                        <div class="batch-progress-header"><span class="batch-progress-text" id="batch-progress-text">0/0</span></div>
                        <div class="batch-bar"><div class="batch-bar-fill" id="batch-progress-bar" style="width:0%"></div></div>
                        <div class="batch-detail" id="batch-detail"></div>
                    </div>
                    <button class="batch-btn" id="batch-run-btn" onclick="startBatchRun()">批量运行</button>
                </div>
            </aside>
            <div class="compare-area">
                <div class="compare-toolbar">
                    <button class="icon-btn" onclick="toggleSidebar()" title="折叠侧栏"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                    <span class="toolbar-label">SPLIT</span>
                    <select id="pane-count" class="toolbar-select" style="width:auto;" onchange="rebuildPanes()"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
                    <div class="toolbar-divider"></div>
                    <button class="gen-btn" onclick="generateAll()">全部生成</button>
                    <div class="header-spacer"></div>
                    <button class="drawer-toggle" id="drawer-toggle" onclick="toggleScoreDrawer()">评分</button>
                    <button class="hbtn" onclick="exportResults()">导出</button>
                </div>
                <div class="split-panes" id="split-view"></div>
            </div>
            <div class="score-drawer closed" id="score-drawer">
                <div class="drawer-header"><span class="drawer-title">检查点评分</span><button class="drawer-close" onclick="toggleScoreDrawer()">&times;</button></div>
                <div class="drawer-body" id="drawer-body"><div class="empty-state" style="padding:30px 10px;"><p>选择测试用例后显示评分</p></div></div>
                <div class="drawer-footer" id="drawer-footer" style="display:none;"><button class="save-btn" onclick="saveScores()">保存评分</button></div>
            </div>
        </div>
    </div>
    <div class="tab-view" id="tab-stats"><div class="full-view"><div class="view-header"><div><div class="view-title">模型统计</div><div class="view-subtitle" id="stats-sub">加载中...</div></div></div><div id="stats-content"></div></div></div>
    <div class="tab-view" id="tab-history"><div class="full-view"><div class="view-header"><div><div class="view-title">历史记录</div><div class="view-subtitle" id="history-sub">加载中...</div></div><button class="hbtn danger" onclick="clearHistory()">清空</button></div><div id="history-content"></div></div></div>
</div>

<div class="status-bar"><div class="status-item"><div class="status-dot" id="status-dot"></div><span id="status-text">就绪</span></div></div>

<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/panes.js"></script>
<script src="./js/generate.js"></script>
<script src="./js/blind.js"></script>
<script src="./js/session.js"></script>
<script src="./js/scoring.js"></script>
<script src="./js/batch.js"></script>
<script src="./js/views.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
